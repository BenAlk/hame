server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip static assets
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Cache hashed build assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Proxy API requests to the api service
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket upgrade support (Home Assistant real-time layer, later phases)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # CalDAV server (spec §10 Phase 5.5) — discovery + the calendar collection.
  # Must precede the SPA fallback so these don't return index.html. WebDAV
  # methods (PROPFIND/REPORT/PUT) pass straight through.
  location /caldav {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /.well-known/caldav {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback. Security headers live here (on the HTML document) rather than
  # server-wide: nginx drops inherited add_header directives in any location that
  # sets its own (e.g. /assets/), and the CSP only needs to govern the document.
  location / {
    try_files $uri $uri/ /index.html;

    # Content-Security-Policy — img-src allows https:/data: because recipe, pet
    # and avatar images are arbitrary external URLs; style/font-src allow the
    # Google Fonts hosts loaded in index.html. connect-src 'self' covers the
    # same-origin API + SSE stream. No inline or remote scripts are used.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }
}
