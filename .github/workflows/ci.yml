name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A push event lost to an Actions outage is never replayed, which leaves a
  # commit with no run and no way to ask for one. This is that way.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @hame/shared build && pnpm --filter uk-bin-scraper build

      - name: Generate Prisma client
        run: pnpm --filter @hame/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
