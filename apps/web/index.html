<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <script>
      // react-grid-layout / react-draggable read `process.env` at runtime (e.g.
      // DRAGGABLE_DEBUG on drag-start); the browser has no `process`, which threw
      // and broke drag/resize. A minimal shim is enough — NODE_ENV is inlined at
      // build time, so React is unaffected.
      window.process = window.process || { env: {} }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4ede1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221d18" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
    />
    <title>Hame</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
